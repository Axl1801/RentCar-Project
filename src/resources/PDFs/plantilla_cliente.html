<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    @page { size: A4; margin: 15mm 12mm; background-color: #fafafa; }
    * { box-sizing: border-box; }
    body { font-family: 'Arial', sans-serif; color: #334155; font-size: 9.5pt; }
    .banner {
        background-color: #02143d;
        color: #ffffff;
        padding: 15px 20px;
        margin-bottom: 25px;
        border-radius: 4px;
        display: table;
        width: 100%;
    }
    .banner-cell { display: table-cell; vertical-align: middle; }
    .banner-title { font-size: 18pt; font-weight: bold; margin: 0; }
    table.data-table { width: 100%; border-collapse: collapse; background-color: #ffffff; }
    table.data-table th { background-color: #02143d; color: #ffffff; text-align: left; padding: 10px; border: 1px solid #02143d; }
    table.data-table td { padding: 10px; border: 1px solid #e2e8f0; }
    table.data-table tr:nth-child(even) { background-color: #f8fafc; }
    .badge-active { background-color: #dcfce7; color: #15803d; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 8pt; }
    .badge-inactive { background-color: #fee2e2; color: #b91c1c; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 8pt; }
</style>
</head>
<body>
    <div class="banner">
        <div class="banner-cell" style="width: 60px;">
            <svg width="40" height="40" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" stroke="#ffffff" stroke-width="6"/>
                <path d="M50 5 L50 95 M5 50 L50 50" stroke="#ffffff" stroke-width="6"/>
                <path d="M12 45 Q 20 20 30 40 T 48 15 L 48 45 Z" fill="#ffffff"/>
            </svg>
        </div>
        <div class="banner-cell">
            <div class="banner-title">Padrón de Clientes - PAZ DRIVE</div>
            <div style="font-size: 9pt; color: #cbd5e1; margin-top: 5px;">Reporte General de Usuarios Registrados</div>
        </div>
    </div>

    <table class="data-table">
        <thead>
            <tr>
                <th style="width: 12%;">ID Letra</th>
                <th style="width: 28%;">Nombre Completo</th>
                <th style="width: 30%;">Correo Electrónico</th>
                <th style="width: 18%;">Teléfono</th>
            </tr>
        </thead>
        <tbody>
            {{filas_clientes}}
        </tbody>
    </table>
</body>
</html>
