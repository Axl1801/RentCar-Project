<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    @page { size: letter; margin: 20mm; }
    body { font-family: 'Arial', sans-serif; color: #334155; }
    .header { background-color: #0f172a; color: white; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 20px; }
    .car-photo { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; border: 2px solid #e2e8f0; margin-bottom: 20px; display: block; text-align: center; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
    th { color: #64748b; width: 40%; }
    td { font-weight: bold; font-size: 12pt; color: #0f172a; }
</style>
</head>
<body>
    <div class="header">
        <h1 style="margin: 0; font-size: 22pt;">Ficha Técnica del Vehículo</h1>
        <p style="margin: 5px 0 0 0; color: #cbd5e1;">ID: {{id_vehiculo}}</p>
    </div>

    <img src="data:image/jpeg;base64,{{foto_base64}}" class="car-photo" />

    <table>
        <tr><th>Marca:</th><td>{{marca}}</td></tr>
        <tr><th>Modelo:</th><td>{{modelo}}</td></tr>
        <tr><th>Año:</th><td>{{anio}}</td></tr>
        <tr><th>Precio por Día:</th><td>${{precio}} MXN</td></tr>
        <tr><th>Estado Actual:</th><td>{{estado}}</td></tr>
    </table>
</body>
</html>
